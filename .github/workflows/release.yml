name: Release
# Publishes the mcpcost package to npm and site/server.json to the official MCP registry, then makes the GitHub release.
# It needs no token and no OTP: npm trusts this workflow file (trusted publishing, with provenance), and the registry
# takes the GitHub OIDC token of this repository for io.github.ondraulehla/*. See README, Releases.
#
# Only a tag v0.Y.Z starts it: the tags v1.x.y and v1 belong to the GitHub Action (action.yml) and its Marketplace
# releases. A step skips a version that is already out, so a run that failed can run again.
on:
  push:
    tags: ['v0.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: the checks, npm publish --dry-run and the registry login, nothing published'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: One version in all five places, the same as the tag, on a commit of main
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version=$(node scripts/version.mjs --check "$GITHUB_REF_NAME") ;;
            refs/heads/main) version=$(node scripts/version.mjs --check) ;;
            *) echo "::error::A release runs from main or from a tag v0.Y.Z, not from $GITHUB_REF."; exit 1 ;;
          esac
          # Only code that is on main goes out: the commit of a tag must be main or an ancestor of main.
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$on_main" != identical ] && [ "$on_main" != behind ]; then
            echo "::error::The commit $GITHUB_SHA is not on main (compare: $on_main). Merge it into main, then tag the commit on main."
            exit 1
          fi
          # A tag that exists must point at this commit, so that npm and the registry get the code of the tag.
          tagged=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}" | tail -n 1 | cut -f 1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag v$version points at $tagged, but this run is on $GITHUB_SHA. Run the workflow from the tag, or set a new version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx tsc -p packages/mcpcost/tsconfig.json --noEmit
      - run: npm test
      - name: Write the Worker types, which astro check reads
        working-directory: site
        run: npx wrangler types
      - run: npm run check -w site
      - name: Pack the package, with the registry entry next to it
        run: |
          npm run build -w packages/mcpcost
          mkdir -p "$RUNNER_TEMP/release"
          (cd packages/mcpcost && npm pack --pack-destination "$RUNNER_TEMP/release")
          cp site/server.json "$RUNNER_TEMP/release/"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # npm trusted publishing with provenance, and the registry login with GitHub OIDC
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # Pinned and checked against its Sigstore bundle, as the registry's guide says. Change it on purpose, never to "latest".
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      # The tarball and server.json that the check job tested. This job runs no code of the repository or of its dependencies.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later. Node 24 has it, Node 22 has npm 10.
          node-version: 24
          # No registry-url: npm uses registry.npmjs.org, and trusted publishing needs no token in an .npmrc.
          # A token line without NODE_AUTH_TOKEN would also hide from the dry run that npm gave no token.
          package-manager-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download mcp-publisher and verify its signature
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Validate server.json before anything is published
        run: ./mcp-publisher validate release/server.json
      - name: Publish to npm
        run: |
          npm --version
          if [ "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::Trusted publishing needs npm 11.5.1 or later."
            exit 1
          fi
          if [ "$(npm view "mcpcost@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::mcpcost $VERSION is on npm already, so this run does not publish it again."
          elif [ "$DRY_RUN" = true ]; then
            npm publish "release/mcpcost-$VERSION.tgz" --provenance --dry-run 2>&1 | tee "$RUNNER_TEMP/npm.log"
            # Without a trusted publisher that matches this workflow, npm gets no token and says so.
            if grep -q 'requires you to be logged in' "$RUNNER_TEMP/npm.log"; then
              echo "::warning::npm did not accept this workflow as a trusted publisher of mcpcost. Check the setting on npmjs.com (README, Releases)."
            fi
          else
            npm publish "release/mcpcost-$VERSION.tgz" --provenance || {
              echo "::error::npm publish failed. After ENEEDAUTH, E401, E403 or E404, check the trusted publisher of mcpcost on npmjs.com (README, Releases)."
              exit 1
            }
          fi
      - name: Publish server.json to the MCP registry
        run: |
          name=$(node -p 'require("./release/server.json").name')
          url="https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$VERSION"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")
          if [ "$status" = 200 ]; then
            echo "::notice::$name $VERSION is in the registry already, so this run does not publish it again."
            exit 0
          fi
          if [ "$status" != 404 ]; then
            echo "::error::The registry answered $status for $url."
            exit 1
          fi
          ./mcp-publisher login github-oidc
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: the registry login works, $name $VERSION is not published."
            exit 0
          fi
          ./mcp-publisher publish release/server.json

  release:
    needs: [check, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the release, and its tag on a run from main
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Make the GitHub release, not marked as Latest
        # --latest=false, as for every package release: the Latest release of the repository stays the release of the
        # Action (v1.1.0 today), which is also the latest version on its Marketplace page.
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::The release $tag exists already."
            exit 0
          fi
          # The notes: the message of an annotated tag, else the message of the release commit, without its Co-Authored-By lines.
          notes=$(
            if ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null) && [ "${ref%% *}" = tag ]; then
              gh api "repos/$GH_REPO/git/tags/${ref#* }" --jq .message
            else
              gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq .commit.message
            fi | sed '/^co-authored-by:/Id'
          )
          printf '%s\n\nnpm: https://www.npmjs.com/package/mcpcost/v/%s\n' "$notes" "$VERSION" > "$RUNNER_TEMP/notes.md"
          # --target names this commit: on a run from main, the release makes the tag here.
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "mcpcost $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
