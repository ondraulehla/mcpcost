name: Daily probe
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Probe only a sample of this size (empty = whole registry)'
        required: false
        default: ''
concurrency:
  group: probe
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    # The probe takes about an hour. Counting with count_tokens is limited to 100 requests a minute, so a day with many changed servers takes longer.
    timeout-minutes: 345
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Exact Claude counts come from the free count_tokens endpoint. Without the key the run keeps the o200k estimate only.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Exact Gemini counts come from the free countTokens endpoint. Without the key the run has no Gemini column.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the previous run's servers.json and the Claude count cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/previous data/cache
          # The run artifact is uploaded after a successful import, so the newest one is also the state of D1.
          # upload-artifact strips the common parent directory, so look for the files wherever they landed.
          for id in $(gh run list --workflow "Daily probe" --status success --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name "probe-$id" --dir data/previous 2>/dev/null; then echo "previous run $id"; break; fi
          done
          # A single-file artifact lands at the target path itself, so copy only when the paths differ.
          f=$(find data/previous -name servers.json | head -1); test -n "$f" && { [ "$f" = data/previous/servers.json ] || cp "$f" data/previous/servers.json; } || echo "::notice::No previous run found, importing everything."
          # The count cache is uploaded before the import, so counting progress survives a failed import.
          for id in $(gh run list --workflow "Daily probe" --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name "claude-cache-$id" --dir data/cache 2>/dev/null; then echo "count cache from run $id"; break; fi
          done
          c=$(find data/cache -name servers.json | head -1); test -n "$c" && { [ "$c" = data/cache/servers.json ] || cp "$c" data/cache/servers.json; } || { test -f data/previous/servers.json && cp data/previous/servers.json data/cache/servers.json && echo "count cache from the previous run" || echo "::notice::No count cache found."; }
          # The newest finished stdio run: package servers probed in containers, no token counts yet.
          mkdir -p data/stdio
          for id in $(gh run list --workflow "Package servers (stdio)" --status success --limit 5 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name "stdio-$id" --dir data/stdio 2>/dev/null; then echo "stdio run $id"; break; fi
          done
          s=$(find data/stdio -name stdio-run.json | head -1); test -n "$s" && { [ "$s" = data/stdio/stdio-run.json ] || cp "$s" data/stdio/stdio-run.json; } || echo "::notice::No stdio run found."
          # The packages derived for gated remote servers, found by the previous run.
          for id in $(gh run list --workflow "Daily probe" --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name "derived-$id" --dir data/cache 2>/dev/null; then echo "derived packages from run $id"; break; fi
          done
          d=$(find data/cache -name derived-packages.json | head -1); test -n "$d" && { [ "$d" = data/cache/derived-packages.json ] || cp "$d" data/cache/derived-packages.json; } || echo "::notice::No derived packages yet."
      - name: Load the credentials for servers that need auth
        # Stored in the D1 table "credentials" by probe/credentials-sync.ts; see the README, "Servers that need auth".
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: node --import tsx probe/credentials-sync.ts pull --out data/cache/credentials.json
      - name: Probe the registry
        run: |
          if [ -n "${{ inputs.sample }}" ]; then
            npm run probe --silent -- --sample "${{ inputs.sample }}" --per-host 2 --out data/raw/probe-run.json --claude-cache data/cache/servers.json --credentials data/cache/credentials.json
          else
            npm run probe --silent -- --all --concurrency 24 --out data/raw/probe-run.json --claude-cache data/cache/servers.json --credentials data/cache/credentials.json
          fi
      - name: Store the refreshed credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && hashFiles('data/cache/credentials.json') != '' }}
        run: node --import tsx probe/credentials-sync.ts push --in data/cache/credentials.json
      - name: Count the tools of the stdio run
        if: ${{ hashFiles('data/stdio/stdio-run.json') != '' }}
        run: node --import tsx probe/count-tools.ts --in data/stdio/stdio-run.json --cache data/cache/servers.json --deadline-min 40
      - name: Dump the board's statuses, so the import can repair rows that drifted
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: npx wrangler d1 execute mcp-pulse --remote --json --command "SELECT name, status FROM servers" > ../data/previous/d1-status.json || rm -f ../data/previous/d1-status.json
      - name: Build one missing token index inside today's write budget
        # Migrations 007 and 008 each build an index over every row, about 42 000 writes of the 100 000 a day.
        # One a day, before the import, which then gets what the index leaves of the budget. Each one drops the
        # index on claude_tokens it replaces, so the site always has an index for the Tokens sort.
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: |
          count() { npx wrangler d1 execute mcp-pulse --remote --json --command "$1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))'; }
          rows=$(count "SELECT count(*) AS n FROM servers")
          if [ "$(count "SELECT count(*) AS n FROM sqlite_master WHERE type='index' AND name='servers_status_shown'")" = "0" ]; then
            npx wrangler d1 execute mcp-pulse --remote --file=migrations/007-shown-tokens.sql && echo "migration 007 applied, about $rows writes" && echo "INDEX_WRITES=$rows" >> "$GITHUB_ENV"
          elif [ "$(count "SELECT count(*) AS n FROM sqlite_master WHERE type='index' AND name='servers_shown'")" = "0" ]; then
            npx wrangler d1 execute mcp-pulse --remote --file=migrations/008-shown-tokens-all.sql && echo "migration 008 applied, about $rows writes" && echo "INDEX_WRITES=$rows" >> "$GITHUB_ENV"
          fi
      - name: Build the site data and the D1 import
        # A sample run (a test of the key or the probe) ends here: its data are not imported, and build-data would
        # refuse 50 servers against 16 000 alive last time as a broken run and paint the whole run red.
        if: ${{ inputs.sample == '' }}
        run: |
          stdio=""; [ -f data/stdio/stdio-run.json ] && stdio="--stdio data/stdio/stdio-run.json"
          if [ -f data/previous/servers.json ]; then
            node --import tsx probe/build-data.ts --in data/raw/probe-run.json --out data/latest --previous data/previous/servers.json $stdio
          else
            node --import tsx probe/build-data.ts --in data/raw/probe-run.json --out data/latest $stdio
          fi
          d1=""; [ -s data/previous/d1-status.json ] && d1="--d1-status data/previous/d1-status.json"
          budget=$(( 85000 - ${INDEX_WRITES:-0} ))
          if [ -f data/previous/servers.json ]; then
            node --import tsx probe/to-sql.ts --in data/latest --out data/latest/import.sql --previous data/previous/servers.json --write-budget "$budget" $d1
          else
            node --import tsx probe/to-sql.ts --in data/latest --out data/latest/import.sql --write-budget "$budget" $d1
          fi
      - name: Write the open dataset of the run
        # One row per probed server, the numbers the board shows, CC BY 4.0, plus the same run as re-check evidence for the registry
        # (modelcontextprotocol/registry#1715). The monthly report publishes both as static files:
        # node --import tsx probe/dataset.ts --publish site/public/data/mcpcost-YYYY-MM.json.gz --publish-evidence site/public/data/mcpcost-evidence-YYYY-MM.json.gz, then commit them.
        # The evidence of every successful run also goes out as /data/mcpcost-evidence-latest.json.gz, see "Keep the re-check evidence for the site".
        if: ${{ inputs.sample == '' }}
        run: node --import tsx probe/dataset.ts --in data/latest --out data/latest
      - name: Find the open-source packages of servers that need auth
        # Reads the repositories the registry names, at most a few hundred an hour; the result feeds the stdio run.
        if: ${{ inputs.sample == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx probe/derive-packages.ts --servers data/latest/servers.json --cache data/cache/derived-packages.json
      - name: Keep the derived packages
        if: ${{ inputs.sample == '' && hashFiles('data/cache/derived-packages.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: derived-${{ github.run_id }}
          path: data/cache/derived-packages.json
          retention-days: 30
      - name: Keep the Claude counts as a cache
        if: ${{ inputs.sample == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-cache-${{ github.run_id }}
          path: data/latest/servers.json
          retention-days: 30
          compression-level: 9
      - name: Apply the schema and the pending migrations
        # schema.sql is idempotent (CREATE ... IF NOT EXISTS). A migration that adds columns runs once, when its first column is missing.
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: |
          npx wrangler d1 execute mcp-pulse --remote --file=schema.sql
          has() { npx wrangler d1 execute mcp-pulse --remote --json --command "SELECT count(*) AS n FROM pragma_table_info('servers') WHERE name='$1'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))'; }
          if [ "$(has gemini_tokens)" = "0" ]; then npx wrangler d1 execute mcp-pulse --remote --file=migrations/003-gemini.sql; echo "migration 003 applied"; fi
          if [ "$(has measured_with_credentials)" = "0" ]; then npx wrangler d1 execute mcp-pulse --remote --file=migrations/004-credentials.sql; echo "migration 004 applied"; fi
          if [ "$(has derived_package)" = "0" ]; then npx wrangler d1 execute mcp-pulse --remote --file=migrations/005-derived.sql; echo "migration 005 applied"; fi
          if [ "$(has auth_documentation)" = "0" ]; then npx wrangler d1 execute mcp-pulse --remote --file=migrations/009-auth-documentation.sql; echo "migration 009 applied"; fi
          if [ "$(has auth_kind)" = "0" ]; then npx wrangler d1 execute mcp-pulse --remote --file=migrations/010-auth-kind.sql; echo "migration 010 applied"; fi
          idx=$(npx wrangler d1 execute mcp-pulse --remote --json --command "SELECT count(*) AS n FROM sqlite_master WHERE type='index' AND name='servers_init_name'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')
          if [ "$idx" != "0" ]; then npx wrangler d1 execute mcp-pulse --remote --file=migrations/006-fewer-indexes.sql; echo "migration 006 applied"; fi
      - name: Import into D1
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: npx wrangler d1 execute mcp-pulse --remote --file=../data/latest/import.sql
      - name: Keep the run as an artifact
        # After the import, so the next run diffs against what D1 really holds. A sample run keeps its raw file only.
        if: ${{ inputs.sample == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            data/raw/probe-run.json
            data/latest/servers.json
            data/latest/hosts.json
            data/latest/dataset.json.gz
          retention-days: 90
          compression-level: 9
      - name: Keep the re-check evidence for the site
        # When this run has succeeded, deploy.yml puts the file on the site as /data/mcpcost-evidence-latest.json.gz.
        # A failed upload must not fail the run; the site then keeps the evidence of the run before.
        if: ${{ inputs.sample == '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: data/latest/evidence.json.gz
          retention-days: 30
          compression-level: 0
      - name: Tell IndexNow which pages changed
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node --import tsx probe/indexnow.ts --changed data/latest/changed.json
      - name: Say when the import was skipped
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the run was not imported into D1."
      - name: Commit the summary
        if: ${{ inputs.sample == '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest/summary.json
          git diff --cached --quiet || git commit -m "data: probe run $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
