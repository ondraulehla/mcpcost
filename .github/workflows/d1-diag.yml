name: Edge rules (temporary)
on:
  push:
    branches: [diag-workers-requests]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_ID: f1984775-849a-4277-805e-537ea5ad7611
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: D1 rows read per hour since 2026-10-23
        continue-on-error: true
        run: node .github/diag/cf.mjs d1-hourly 2026-10-23
      - name: Worker requests since midnight, sampled
        continue-on-error: true
        env:
          STEP_MIN: 60
        run: node .github/diag/cf.mjs logs 2026-10-23T22:00:00Z 2026-10-24T12:00:00Z
