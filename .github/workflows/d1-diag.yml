name: Edge rules (temporary)
# Writes the zone's WAF rules with a token that has Zone WAF: Edit, kept as the secret CLOUDFLARE_ZONE_TOKEN.
on:
  push:
    branches: [diag-workers-requests]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Is the zone token there?
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::The secret CLOUDFLARE_ZONE_TOKEN is not set: a token with Zone WAF: Edit and Zone: Read on ulehla.dev. Nothing was written."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry run
        if: ${{ steps.token.outputs.present == 'true' }}
        run: node site/edge/rules.mjs --dry-run
      - name: Write the rules
        if: ${{ steps.token.outputs.present == 'true' }}
        run: node site/edge/rules.mjs
