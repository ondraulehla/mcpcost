name: Edge rules (temporary)
# Writes the zone's WAF rules with a token that has Zone WAF: Edit, kept as the secret CLOUDFLARE_ZONE_TOKEN.
on:
  push:
    branches: [diag-workers-requests]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dry run
        run: node site/edge/rules.mjs --dry-run
      - name: Write the rules
        run: node site/edge/rules.mjs
